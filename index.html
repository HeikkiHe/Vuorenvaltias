.pv{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}

  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);

function audioUpdate(dt){

const parts=[];

  parts.push({x,y,z,vx:-f0*sp-f1*sd,vy:-f1*sp+f0*sd,vz:1.5+Math.random()*3,life:.9,max:.9,col:Math.random()<.5?'#5a4130':WX.dust,r:.06+Math.random()*.08,g:9.8,clod:true});}

function endRun(msg,crashed){if(state==='watch'){watchCrash(msg,crashed);return;}if(state!=='play')return;state='end';endMsg=msg;yritykset++;SND.crashed=crashed;if(crashed)sfx.crash();
  if(crashed)dust(B.x,B.y,(B.air?B.z:B.hr)+.5,WX.dust,30,5);
  const valmis=maxS>=FINISH,tulos=valmis?LEN:Math.min(LEN,Math.max(0,arcOf(maxS)));let uusi=false;
  if(tulos>paras+1e-6||(valmis&&(!parasAika||aika<parasAika))){uusi=true;paras=Math.max(paras,tulos);if(valmis)parasAika=parasAika?Math.min(parasAika,aika):aika;lsSet('mkParas_'+T.id+'_'+BK.id,String(paras));if(parasAika)lsSet('mkAika_'+T.id+'_'+BK.id,String(parasAika));}
  lastResult={tulos,uusi,aika,valmis};
  if(mode==='sarja'&&SER&&SER.phase==='race'){const res={d:tulos,t:valmis?aika:null};recordFrame(0);
    if(cmpRes(res,bestOf(SER.cur.me))<0)BESTREC[recKey()]={frames:REC.slice(),msg,crashed};recordAttempt(res);}
  else if(mode==='kaveri'&&FR&&!FR.done){FR.last={pi:FR.idx,res:{d:tulos,t:valmis?aika:null}};frRecord(FR.last.res);}else rollPracticeWx();
  if(valmis)sfx.finish();if(uusi&&tulos>0)sfx.record();
  setTimeout(()=>{if(state==='end')showOv(mode==='sarja'?'sarjaYritys':mode==='kaveri'?'kaveriYritys':'end');},crashed?800:500);}
let lastResult=null;

/* Pyörän kosketus maahan: renkaan säde pyöristää terävät reunat (pyörä ei putoa kapeisiin kuoppiin
   eikä nouse jyrkkää seinää pitkin pistemäisesti). */
const WOFF=[-.26,-.13,0,.13,.26],WDROP=WOFF.map(d=>RW-Math.sqrt(RW*RW-d*d));
function wheelH(x,y,f0,f1){let m=-1e9;for(let k=0;k<5;k++){const d=WOFF[k],h=H(x+f0*d,y+f1*d)-WDROP[k];if(h>m)m=h;}return m;}
function groundAlpha(x,y,th,ca){const f0=Math.cos(th),f1=Math.sin(th),lh=L*ca;return Math.atan2(wheelH(x+f0*lh,y+f1*lh,f0,f1)-wheelH(x,y,f0,f1),lh);}
function initGround(){const f0=Math.cos(B.th),f1=Math.sin(B.th);B.hr=wheelH(B.x,B.y,f0,f1);let a=0;for(let k=0;k<10;k++)a=groundAlpha(B.x,B.y,B.th,Math.cos(a));
  B.alpha=a;B.hf=wheelH(B.x+f0*L*Math.cos(a),B.y+f1*L*Math.cos(a),f0,f1);B.z=B.hr;B.wg=B.wgS=0;B.bvz=0;B.fvz=B.rvz=0;B.xcPrev=BK.xc0+BK.xcR*rider.fb;}
// moottori: vääntö rajoittaa alhaisilla nopeuksilla, teho (n. 65 kW / 200 kg) suuremmilla, rajoitin 115 km/h
function driveMax(v){const a=Math.abs(v);let d=Math.min(BK.Dmax,BK.P/Math.max(a,1));if(a>BK.vmax-2)d*=Math.max(0,(BK.vmax-a)/2);return d;}
const CDRAG=.003;
function step(dt){
  simT+=dt;
  const rk=Math.min(1,dt*7);rider.fb+=(inp.fb-rider.fb)*rk;rider.lr+=(inp.lr-rider.lr)*rk;
  const f0=Math.cos(B.th),f1=Math.sin(B.th),r0=-f1,r1=f0;
  const thr=inp.thr,brk=inp.brk,fb=rider.fb;
  const xc=BK.xc0+BK.xcR*fb,dxc=(xc-B.xcPrev)/dt;B.xcPrev=xc;
  if(B.air){
    B.airT+=dt;B.vz-=G*dt+CDRAG*B.vz*Math.abs(B.vz)*dt;B.vh-=CDRAG*B.vh*Math.abs(B.vh)*dt;
    B.x+=f0*B.vh*dt;B.y+=f1*B.vh*dt;B.z+=B.vz*dt;
    // ilmassa: takapyörän kiihdytys nostaa keulaa, jarru laskee, kuljettajan siirto kääntää runkoa vastakkaiseen suuntaan
    B.om+=(thr*2.4-brk*3.8)*BK.airK*dt-dxc*.5*dt;B.om*=1-.25*dt;B.pa+=B.om*dt;
    B.slip=0;B.use=0;
    const cpa=Math.cos(B.pa),lh=L*cpa,fx=B.x+f0*lh,fy=B.y+f1*lh;
    const hrg=wheelH(B.x,B.y,f0,f1),hfg=wheelH(fx,fy,f0,f1),fz=B.z+L*Math.sin(B.pa);
    if(B.z<=hrg||fz<=hfg){
      let a=Math.atan2(hfg-hrg,Math.max(.5,lh));for(let k=0;k<2;k++){const l2=L*Math.cos(a);a=Math.atan2(wheelH(B.x+f0*l2,B.y+f1*l2,f0,f1)-hrg,l2);}
      const ca=Math.cos(a),sa=Math.sin(a),l2=L*ca;
      const phi=B.pa-a,vt=B.vh*ca+B.vz*sa,vn=Math.max(0,-(B.vz*ca-B.vh*sa));
      B.air=false;B.hr=hrg;B.hf=wheelH(B.x+f0*l2,B.y+f1*l2,f0,f1);B.alpha=a;B.wg=B.wgS=0;
      if(phi>1.2){endRun('m_flip',true);return;}
      if(phi<-.62&&(vn>4.5||B.pa<-.35)){endRun('m_nose',true);return;}
      if(vn>12){endRun('m_hard',true);return;}
      // pinnan suuntainen vauhti säilyy, iskun ottaa jousitus; etupyörällä alastulo maksaa enemmän
      B.v=vt*(1-Math.min(.2,vn*.01))*(phi<0?1+phi*.5:1);
      if(phi>0){B.phi=phi;B.om=Math.min(B.om,B.om-vn*.6-.5);}else{B.phi=0;B.om=0;}
      B.z=Math.max(hrg-.28,Math.min(B.z,hrg));B.bvz=B.vz;B.rvz=B.v*sa;B.fvz=B.v*sa;
      dust(B.x,B.y,hrg+.2,WX.dust,Math.min(14,4+vn),2+vn*.3);
      sfx.land(vn);if(B.airT>.45)SND.cheer=Math.min(2.5,SND.cheer+B.airT*1.5);
    }
  }else{
    const a=B.alpha,ca=Math.cos(a),sa=Math.sin(a);
    const tB=(H(B.x+r0*.6,B.y+r1*.6)-H(B.x-r0*.6,B.y-r1*.6))/1.2,cb=1/Math.sqrt(1+tB*tB),sb=tB*cb;
    const s=-B.x,mu=muAt(s)*BK.grip*WX.grip*(state==='watch'&&W.phase==='climb'?1.25:1);
    const gN=G*ca*cb,frontUp=B.phi>.02;
    // takapyörän kuorma: paino + kiihdytyksen aiheuttama painonsiirto (momentti etupyörän kosketuspisteen ympäri)
    const nr=D0=>frontUp?gN:Math.min(gN,Math.max(0,(gN*(L-xc)+D0*HC)/L));
    const dreq=thr*driveMax(B.v);
    let Nr=nr(dreq),fmax=mu*Nr,D=dreq,slip=0;
    if(dreq>fmax){Nr=nr(fmax*.8);fmax=mu*Nr;D=Math.min(dreq,fmax*.8);slip=Math.min(1,.35+(dreq-fmax)/4);}
    B.use=fmax>0?Math.min(1.3,dreq/fmax):0;
    const brakeF=brk*mu*(frontUp?Nr:gN)*.9,drag=CDRAG*B.v*Math.abs(B.v),grav=G*sa,res=.2+WX.rr+(thr<.05?.6:0);
    const F=D-grav-drag,sv=Math.sign(B.v);
    if(Math.abs(B.v)<.15){const st=res+brakeF;if(Math.abs(F)<=st)B.v=0;else B.v+=(F-Math.sign(F)*st)*dt;}
    else{const nv=B.v+(F-sv*(res+brakeF))*dt;B.v=(Math.sign(nv)!==sv&&Math.abs(F)<=res+brakeF)?0:nv;}
    // keulinta: momentti takapyörän ympäri (veto ja jarru vs. painovoima)
    const A=D-drag-(B.v>.1?brakeF:0);
    const cp=Math.cos(B.phi),sp=Math.sin(B.phi),rx=xc*cp-HC*sp,ry=xc*sp+HC*cp;
    const tau=A*ry-gN*rx,I=xc*xc+HC*HC+BK.Ix;
    // nopea painonsiirto taakse kevenää keulaa (ja eteen painaa sitä)
    B.om+=-dxc*.8*dt;
    if(B.phi<=0&&tau<=0&&B.om<=0){B.phi=0;B.om=0;}
    else{B.om+=tau/I*dt;B.om*=1-1.1*dt;B.phi+=B.om*dt;if(B.phi<0){B.phi=0;B.om=B.om<-1.5?-B.om*.15:0;}}
    if(B.phi>1.2){endRun('m_flip',true);return;}
    // ohjaus: kääntösäde kasvaa vauhdin mukana, etupyörän kuorma parantaa ohjausta
    const frontLoad=frontUp?0:Math.max(0,1-Nr/gN);
    const steerEff=frontUp?.1:.4+frontLoad*1.3;
    const vab=Math.abs(B.v),vs=Math.min(1,vab/2.5);
    const latMax=mu*gN*.9;
    let yaw=rider.lr*Math.min(1.4*steerEff,1.15*latMax/Math.max(vab,1))*vs*(B.v<0?-1:1);
    const latReq=Math.abs(B.v*yaw);
    if(latReq>latMax){B.u-=Math.sign(yaw*B.v)*(latReq-latMax)*dt;yaw*=latMax/latReq;slip=Math.max(slip,.4);}
    B.fish+=((Math.random()-.5)*slip*14-B.fish*3)*dt;
    B.th+=(yaw+B.fish*Math.min(1,vab/2+.3))*dt;
    const side=G*sb,hold=mu*gN*(slip>0?.35:.85);
    if(Math.abs(side)>hold)B.u-=Math.sign(side)*(Math.abs(side)-hold)*dt;
    B.u*=Math.exp(-(slip>0?1.5:6)*dt);
    if(Math.abs(sb)>.62&&vab<2){endRun('m_side',true);return;}
    if(Math.abs(B.u)>5){endRun('m_rear',true);return;}
    B.slip=slip;B.wr+=(B.v*(1+slip*1.5))/RW*dt;
    // liike
    const vh=B.v*ca,g0=Math.cos(B.th),g1=Math.sin(B.th);
    const nx=B.x+(g0*vh+r0*B.u)*dt,ny=B.y+(g1*vh+r1*B.u)*dt;
    const hrN=wheelH(nx,ny,g0,g1);
    const lh=L*ca,hfN=wheelH(nx+g0*lh,ny+g1*lh,g0,g1);
    const raw=(hrN-B.hr)/dt,rawF=(hfN-B.hf)/dt;
    // pyörät osuvat kynnyksiin ja kumpareisiin: pyörän pystynopeuden äkillinen muutos jarruttaa
    if(B.v>0){const dW=raw-B.rvz,dF=frontUp?0:rawF-B.fvz;let l=0;if(dW>0)l+=.2*dW*dW;if(dF>0)l+=.18*dF*dF;
      if(l>0){B.v=Math.sqrt(Math.max(0,B.v*B.v-l));if(Math.max(dW,dF)>3.5)sfx.thud(Math.max(dW,dF)*2);}}
    B.rvz=Math.max(-vab-1,Math.min(vab+1,raw));B.fvz=Math.max(-vab-1,Math.min(vab+1,rawF));
    // jousitus: runko (B.z) on jousen ja vaimentimen varassa; staattinen tila e=0
    const rel=B.bvz-B.rvz,acc=Math.max(-G,-98*(B.z-hrN)-(rel>0?20:10)*rel); // paluuvaimennus jäykempi kuin puristus
    B.bvz+=acc*dt;let bz=B.z+B.bvz*dt;
    if(bz-hrN<-.28){const d=B.rvz-B.bvz;if(d>0&&B.v>0){B.v=Math.sqrt(Math.max(0,B.v*B.v-.5*d*d));if(d>3)sfx.thud(d*2.5);}
      bz=hrN-.28;B.bvz=Math.max(B.bvz,Math.min(B.rvz,vab*Math.sin(a)+2.5));}
    if(vab>3&&bz-hrN>.16){
      // jousitus täysin auki ja pyörät irti maasta
      B.air=true;B.airT=0;B.x=nx;B.y=ny;B.z=bz;B.vz=B.bvz;B.vh=vh;B.pa=a+B.phi;if(B.phi<=0)B.om+=B.wgS*.6;
    }else{
      // maaston kallistuksen muutos: keula nousee, jos pyörän kiertoliike pysähtyy nopeammin kuin painovoima ehtii kääntää sitä
      const aN=Math.atan2(hfN-hrN,lh),da=aN-a,wg=da/dt,wgS0=B.wgS;
      B.wgS+=(wg-B.wgS)*Math.min(1,dt*35);
      if(B.phi>0)B.phi=Math.max(0,B.phi-da);
      else if(vab>1.5){const req=-(B.wgS-wgS0)/dt,avail=Math.max(0,-tau/I);if(req>avail)B.om+=Math.min(300,req-avail)*dt*.75;}
      B.wg=wg;B.alpha=aN;B.x=nx;B.y=ny;B.hr=hrN;B.hf=hfN;B.z=bz;
    }
    if(slip>0&&thr>.1&&Math.random()<dt*45*slip*WX.dustK)dust(B.x-f0*.3,B.y-f1*.3,B.hr+.2,WX.dust,1,2.5);
    if(thr>.25&&!B.air&&B.v>-.5&&Math.random()<dt*(10+60*slip)*thr)roost(B.x-f0*.25,B.y-f1*.25,B.hr+.15,f0,f1,slip);
    collide();if(state!=='play'&&!(state==='watch'&&W.phase!=='done'))return;
  }
  // kisan säännöt
  const s=sFront();
  if(!ajossa&&s>=0)ajossa=true;
  if(ajossa)maxS=Math.max(maxS,s);
  if(Math.abs(B.y)>HALFW+.5){endRun('m_out',true);return;}
  if(maxS>=FINISH){endRun('m_top',false);return;}
  if(ajossa&&!B.air){
    if(B.v<-1.2){endRun('m_back',false);return;}
    if(Math.abs(B.v)<.3)B.stopT+=dt;else B.stopT=0;
    if(B.stopT>1.5){endRun('m_stop',false);return;}
  }
}
function collide(){
  const f0=Math.cos(B.th),f1=Math.sin(B.th),lh=L*Math.cos(B.alpha),fx=B.x+f0*lh,fy=B.y+f1*lh;
  for(const o of rocks){
    if(Math.abs(o.x-B.x)>4||Math.abs(o.y-B.y)>4)continue;
    const df=Math.hypot(fx-o.x,fy-o.y),dr=Math.hypot(B.x-o.x,B.y-o.y);
    if(df<o.r+.3&&(!o.bf||simT-o.bf>.8)){o.bf=simT;
      if(B.phi<.12){B.v*=.82;B.th+=(Math.random()-.5)*.35;B.om+=1.2+B.v*.08;}
      dust(o.x,o.y,o.z+.3,'#999',5,2);sfx.rock();}
    if(dr<o.r+.3&&(!o.br||simT-o.br>.8)){o.br=simT;sfx.rock();B.v*=.85;B.om+=.9;B.fish+=(Math.random()-.5)*2;}
  }
}

const ptr=new Map();let leftP=null,rightP=null;
const K=new Set();
function updInp(){
  if(state==='watch')return;
  let thr=0,brk=0,fb=0,lr=0;
  if(leftP){const dy=leftP.sy-leftP.y;thr=Math.max(0,Math.min(1,dy/100));brk=Math.max(0,Math.min(1,-dy/70));}
  fb=1;
  if(rightP){const dx=(rightP.x-rightP.sx)/70,down=Math.max(0,Math.min(1,(rightP.y-rightP.sy)/100));lr=Math.max(-1,Math.min(1,dx));fb=1-2*down;}
  if(K.has('KeyW')||K.has('Space'))thr=1;if(K.has('KeyS'))brk=1;
  if(K.has('ArrowDown'))fb=-1;else if(K.has('KeyN'))fb=0;if(K.has('ArrowLeft'))lr=-1;if(K.has('ArrowRight'))lr=1;
  inp.thr=thr;inp.brk=brk;inp.fb=fb;inp.lr=-lr;
  if(window.__bot)window.__bot(inp,B);
}

const ZL=[1,.72,1.4];let zi=0;
let camX=0,camY=0,camZ=0,s=6,camIX=0,camIY=0;
function baseScale(){return Math.max(4.5,Math.min(14,Math.min(Wd,Ht)/56));}
function camTarget(){const la=10+Math.min(14,Math.abs(B.v)*.6);return [B.x+Math.cos(B.th)*la,B.y*.5+Math.sin(B.th)*la];}
function camInit(){const t=camTarget();camX=t[0];camY=t[1];camZ=H(t[0],t[1]);s=baseScale()*ZL[zi];updCam(0);}
function updCam(dt){const t=camTarget(),k=Math.min(1,dt*2.5);camX+=(t[0]-camX)*k;camY+=(t[1]-camY)*k;camZ+=(H(t[0],t[1])-camZ)*k;
  s+=(baseScale()*ZL[zi]-s)*Math.min(1,dt*5);camIX=(camY-camX)*C;camIY=(camX+camY)*S-camZ*VZ;}
const OY=()=>Ht*(Ht>Wd?.6:.55);
function toScr(x,y,z){return [((y-x)*C-camIX)*s+Wd/2,((x+y)*S-z*VZ-camIY)*s+OY()];}

/* ================= piirto ================= */
function drawTerrain(){
  const vx0=camIX-Wd/2/s,vx1=camIX+Wd/2/s,vy0=camIY-OY()/s,vy1=camIY+(Ht-OY())/s;
  const budget={n:2};
  const tx0=Math.floor(vx0/TW),tx1=Math.floor(vx1/TW),ty0=Math.floor(vy0/TW),ty1=Math.floor(vy1/TW);
  const sz=TW*s+.6;
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){const t=getTile(tx,ty,budget);if(!t)continue;
    ctx.drawImage(t,(tx*TW-camIX)*s+Wd/2,(ty*TW-camIY)*s+OY(),sz,sz);}
}
function drawObj(o,p){
  const [x,y]=p;
  if(o.t==='tree'){const ts=o.s*s;
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x+ts*.6,y+ts*.2,ts*1.5,ts*.6,0,0,7);ctx.fill();
    ctx.fillStyle='#4e3522';ctx.fillRect(x-ts*.18,y-ts*1.4,ts*.36,ts*1.4);ctx.fillStyle='#6b4a30';ctx.fillRect(x-ts*.18,y-ts*1.4,ts*.12,ts*1.4);
    const tier=(w,b0,t0,c1,c2)=>{ctx.fillStyle=c1;ctx.beginPath();ctx.moveTo(x-w,y-b0);ctx.lineTo(x+w,y-b0);ctx.lineTo(x,y-t0);ctx.fill();
      ctx.fillStyle=c2;ctx.beginPath();ctx.moveTo(x-w,y-b0);ctx.lineTo(x-w*.15,y-b0+ts*.12);ctx.lineTo(x,y-t0);ctx.fill();};

   Sijoituksista saa pisteitä; sarjan kolme parasta nousevat seuraavaan luokkaan (125cc → 500cc → Open).

const OPP_NAMES=['Kalle Vuorinen','Jonas Brandt','Luca Ferrero','Pierre Dumont','Sami Hakala','Erik Lindqvist','Tomás Novák','Felix Huber','Joni Lahti','Marco Bellini','Antti Rinne'];

const SKILL=[[.15,.78],[.3,.9],[.4,.97]];
function prng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

function newSeries(ci){const seed=(Date.now()*7919)%2147483647,r=prng(seed),[lo,hi]=SKILL[ci];
  const names=OPP_NAMES.slice().sort(()=>r()-.5);
  const opp=names.map((n,i)=>({n,sk:Math.min(.99,Math.max(.05,lo+(hi-lo)*(i/(names.length-1))+(r()-.5)*.08))}));
  SER={ci,race:0,phase:'race',seed,opp,pts:{},races:[],cur:null,tl:CLASS_TRACKS[ci]};SER.cur=makeRace(0);saveSer();}
function raceWx(ri){const r=prng(SER.seed+ri*7+3),w=[pickW(WX_START,r)];for(let k=1;k<3;k++)w.push(pickW(WX_NEXT[w[k-1]],r));return w;}
function makeRace(ri){const t=serTracks()[ri],r=prng(SER.seed+ri*101),P=POT[t.id][SER.ci],wx=raceWx(ri);
  const opp=SER.opp.map(o=>{const at=[];for(let k=0;k<3;k++){const wf=1+.28*(Math.min(1.07,WEATHERS[wx[k]].grip)-1);
      let f=P*(.55+.5*o.sk)*(.92+.12*r())*wf;

      at.push(f>=1?{d:t.pituus,t:t.pituus/(8+6*o.sk)*(.95+.1*r())/wf}:{d:Math.max(3,f*t.pituus),t:null});}return at;});
  return {track:t.id,opp,me:[],wx};}
function curWx(){const c=SER.cur;if(!c.wx){c.wx=raceWx(SER.race);saveSer();}return c.wx[Math.min(2,c.me.length)];}
function cmpRes(a,b){if(!a&&!b)return 0;if(!a)return 1;if(!b)return -1;if(a.t!=null&&b.t!=null)return a.t-b.t;if(a.t!=null)return -1;if(b.t!=null)return 1;return b.d-a.d;}

   automaattiohjauksella, joka vie hänet täsmälleen tulokseensa asti. Oma paras näytetään tallennettuna uusintana. */
let REC=[],recT=0,SKIN=null;const BESTREC={};

  ['#e8e8e8','#bbbbbb','#e8382a'],['#f2c230','#c99a10','#222222'],['#333333','#555555','#ff7a20'],['#e8382a','#b02010','#ffffff']];
function skinFor(name){let h=7;for(const c of name)h=(Math.imul(h,31)+c.charCodeAt(0))>>>0;const k=SKINS[h%SKINS.length];return {col:k[0],col2:k[1],j:k[2]};}
function recKey(){return SER.seed+'_'+SER.race;}

  SER.opp.forEach((o,i)=>{const b=bestOf(c.opp[i].slice(0,k));if(cmpRes(b,best)<0){best=b;who=o.n;}});
  const mb=bestOf(c.me);if(mb&&cmpRes(mb,best)<=0&&BESTREC[recKey()]){best=mb;who=ME;mine=true;}
  return best?{best,who,mine}:null;}
function setupFlag(){const th=thirdTarget();bestObj.on=!!th&&th.t==null;bestObj.label='flag_3rd';if(th)bestObj.x=-sOfArc(Math.min(LEN,th.d));bestObj.z=H(bestObj.x,bestObj.y);}

function autopilot(){
  const err=((B.th-Math.PI+Math.PI*3)%(Math.PI*2))-Math.PI;
  inp.lr=Math.max(-1,Math.min(1,B.y*.15-err*2.5));inp.brk=0;
  if(W.phase==='finale'){if(W.ending==='flip'){inp.thr=1;inp.fb=-1;}else{inp.thr=0;inp.fb=.3;}return;}
  inp.fb=Math.max(-1,Math.min(1,.5+(B.phi-.2)*3));
  let thr=W.thr;if(B.use>1)thr*=.97;else thr=Math.min(1,thr+.02);if(B.phi>.4)thr*=.9;W.thr=thr;
  if(B.air){thr=B.pa>.9?0:.6;inp.fb=0;}
  inp.thr=thr;}
function puppetAssist(dt){
  if(W.phase==='finale'){W.fT+=dt;if(W.fT>5)endWatch('m_stop',false);return;}
  if(W.phase!=='climb')return;
  if(B.phi>.55){B.phi=.55;B.om=Math.min(B.om,0);}
  const a=arcOf(sFront());
  if(!B.air&&B.v<2.5&&a<W.target-1)B.v+=4*dt;
  if(Math.abs(B.y)>HALFW-1.2){B.y=Math.sign(B.y)*(HALFW-1.2);B.u=0;}
  if(W.res.t==null&&a>=W.target-(W.ending==='stall'?1.4:.6)){W.phase='finale';W.fT=0;}
  if(W.t>70)finishWatch(true);}
function replayStep(dt){const fr=W.rec.frames;if(!fr||!fr.length){endWatch(W.rec?W.rec.msg:'m_stop',false);return;}
  W.t+=dt;let i=W.fi||0;while(i<fr.length-2&&fr[i+1].t<=W.t)i++;W.fi=i;
  const a=fr[i],b=fr[Math.min(i+1,fr.length-1)],k=b.t>a.t?Math.max(0,Math.min(1,(W.t-a.t)/(b.t-a.t))):0,l=(p,q)=>p+(q-p)*k;
  B.x=l(a.x,b.x);B.y=l(a.y,b.y);B.z=l(a.z,b.z);B.hr=l(a.hr,b.hr);B.th=l(a.th,b.th);B.alpha=l(a.al,b.al);B.phi=l(a.ph,b.ph);B.pa=l(a.pa,b.pa);
  B.air=!!a.air;B.v=l(a.v,b.v);B.vh=l(a.vh,b.vh);B.wr=l(a.wr,b.wr);B.slip=a.sl;rider.fb=l(a.fb,b.fb);rider.lr=l(a.lr,b.lr);inp.thr=a.thr;
  maxS=a.ms;ajossa=!!a.aj;aika=a.ak;
  if(W.t>=fr[fr.length-1].t)endWatch(W.rec.msg,W.rec.crashed);}
function recordFrame(dt){recT+=dt;if(REC.length<6000)REC.push({t:recT,x:B.x,y:B.y,z:B.z,hr:B.hr,th:B.th,al:B.alpha,ph:B.phi,pa:B.pa,air:B.air?1:0,v:B.v,vh:B.vh||0,
